name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run fmt
        run: cargo fmt --check

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo Build
        run: cargo rustc -- -D warnings

  # This job will only succeed if all other jobs succeed
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [fmt, build]
    permissions:
      contents: none
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [[ "${{ needs.fmt.result }}" != "success" ]]; then
            echo "❌ Fmt failed"
            exit 1
          fi
          echo "✅ All checks passed!"

      - name: Comment on PR failure
        if: failure() && github.event_name == 'pull_request'
        env:
          COMMENT_BODY: |
            ## ❌ **CI Checks Failed**

            The following checks failed:
            ${{ needs.build.result != 'success' && '- Build (For build issues: Run `cargo build` locally)' || '' }}
            ${{ needs.fmt.result != 'success' && '- Fmt (Run `cargo fmt` locally)' || ''}}

            _Please fix the issues before merging this PR._

            ---

            > **Details:**
            > - **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            > - **Branch:** `${{ github.head_ref || github.ref_name }}`
            > - **Triggered by:** @${{ github.actor }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}
          header: CI-MONITOR
          message: ${{ env.COMMENT_BODY }}

      - name: Comment on PR success
        if: success() && github.event_name == 'pull_request'
        env:
          COMMENT_BODY: |
            ## ✅ **All CI Checks Passed**

            All checks have passed successfully. Thank you for contributing to the project ✌🏼!

            ---

            > **Details:**
            > - **Commit:** (https://github.com/${{ github.repository }}/commit/${{ github.sha }})
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}
          header: CI-MONITOR
          message: ${{ env.COMMENT_BODY }}
